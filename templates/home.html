<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shikumli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #111827;
            color: #F9FAFB;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container-flex {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 40px;
            max-width: 1200px;
        }

        .left {
            text-align: left;
            max-width: 500px;
        }

        .branding {
            font-size: 42px;
            font-weight: bold;
            color: #F97316;
            margin-bottom: 30px;
        }

        .headline {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 50px;
        }

        .streak-button {
            width: 180px;
            height: 180px;
            background-color: #FF6B35;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
            border: none;
            text-decoration: none;
        }

        .streak-button:hover {
            transform: scale(1.07);
            background-color: #e85c2b;
        }

        .streak-count {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .mascot {
            max-height: 400px;
            border-radius: 20px;
        }

        @media screen and (max-width: 768px) {
            .container-flex {
                flex-direction: column;
                text-align: center;
            }
            .left {
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container-flex">
    <div class="left">
        <div class="branding">Shikumli</div>
        <div class="headline">
            The smart, motivating way to recover, train and grow.
        </div>
        <a class="streak-button" href="/choose">
            <i class="fas fa-fire"></i>
            <div class="streak-count">{{ streak_days }}</div>
        </a>
    </div>
    <div class="right">
        <img src="{{ url_for('static', filename='mascot.png') }}" alt="Mascot" class="mascot">
    </div>
</div>
</body>
</html>
