<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workout Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #111827;
            color: #F9FAFB;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 60px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #F97316;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #FCD34D;
        }

        .stars {
            margin: 30px 0;
        }

        .star {
            font-size: 60px;
            color: #FCD34D;
            margin: 10px;
        }

        .star.gray {
            color: #4B5563;
        }

        .tips-box {
            background-color: #1F2937;
            border-radius: 16px;
            padding: 30px;
            margin: 30px auto;
            max-width: 600px;
            text-align: left;
        }

        .tips-box h3 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #F97316;
        }

        .tips-box ul {
            list-style-type: disc;
            padding-left: 20px;
        }

        .tips-box li {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .btn-restart {
            margin-top: 40px;
            font-size: 20px;
            padding: 15px 30px;
            background-color: #48BB78;
            border: none;
            border-radius: 12px;
            color: white;
            transition: background-color 0.3s;
        }

        .btn-restart:hover {
            background-color: #38A169;
        }
    </style>
</head>
<body>
<h1>Workout Complete!</h1>
<h2>{{ exercise }}</h2>

<div class="stars">
    {% for i in range(1, 4) %}
    {% if i <= stars %}
    <span class="star">★</span>
    {% else %}
    <span class="star gray">☆</span>
    {% endif %}
    {% endfor %}
</div>

{% if tips %}
<div class="tips-box">
    <h3>Tips for Next Time:</h3>
    <ul>
        {% for tip in tips %}
        <li>{{ tip }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<a href="/choose" class="btn btn-restart">Start Again</a>
</body>
</html>
